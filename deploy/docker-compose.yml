# B-fast stack for the always-on Sydney server (FD v3.0 §19.2, §21.1 BF0). PAPER ONLY.
#
# - Nothing is reachable from the internet. The only published port is the phone app
#   (dashboard) on the host's LOOPBACK (127.0.0.1:8080, BF-D37): the owner reaches it through
#   `tailscale serve --bg 8080` (HTTPS, their tailnet only); UFW denies public inbound.
#   The app's actions (/act/..., BF-D39) are forwarded by the dashboard to the trader's
#   control server on the private `control` network (port 8081, never published), which
#   checks the Tailscale log-in, the form token and the 6-digit code itself.
# - Messages (BF-D40): `notify.channel: app` (default) = the phone app only. For Telegram
#   (`telegram` or `both`) add the override file, which adds the telegram_bot_token secret:
#   docker compose -f docker-compose.yml -f docker-compose.telegram.yml ... (the bigwins
#   menu does this by itself when the config says telegram or both).
#   Admin access is over Tailscale SSH to the host (docs/SETUP_SYDNEY.md).
# - Images are pinned by tag AND digest (BP-10). Re-pin deliberately.
# - Secrets are Docker secrets read from files under ./secrets (never in git): the folder
#   700, the files 444 (bind mounts keep the host mode; the containers run as other uids).
#   The one-shot service secrets-check (uid 10001, no network, contents never read)
#   checks every file at start-up and the other services wait for it (BF-D33);
#   deploy/check_secrets.sh checks the folder on the host.
#   The IBKR login is used only by the gateway container; the trader never sees it.
# - TRADING_MODE=paper. The live port (4003) is not used; the trader refuses it anyway.

name: asx-trader-bfast

services:
  secrets-check:
    # BF-D33: every secret file is there, non-empty and readable by a non-root, non-owner
    # uid (444); a failure stops the stack with "SECRET CHECK FAILED: ..." in its log
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: asx-trader-bfast-trader:local
    user: "10001:10001"
    network_mode: none
    restart: "no"
    secrets: [tws_password, db_password, totp_seed, eodhd_api_token, healthchecks_url,
              ibkr_flex_token, ibkr_flex_query_id, vapid_private_key, app_proxy_key,
              worker_job_key, db_dashboard_password, app_passphrase]
    volumes:
      - ../config:/app/config:ro  # notify.channel decides which secrets are needed (BF-D40)
    command: ["trader-bf", "check-secrets", "--all"]

  gw-paper:
    # gnzsnz/ib-gateway, stable channel 10.37 (checked 2026-11-19 on ghcr.io)
    image: ghcr.io/gnzsnz/ib-gateway:10.37.1r@sha256:b248e4dad68cc1de8dd1905ea8598089e92307dfec57f59e08a28182bbb002d5
    restart: unless-stopped
    environment:
      TRADING_MODE: paper
      TWS_USERID: ${IBKR_PAPER_USERID:?set in deploy/.env (not committed)}
      TWS_PASSWORD_FILE: /run/secrets/tws_password
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TIME_ZONE: Australia/Sydney
      TZ: Australia/Sydney
    secrets: [tws_password]
    depends_on:
      secrets-check: {condition: service_completed_successfully}
    mem_limit: 1500m  # review F11
    # internal: the trader reaches gw-paper:4004 there; gw-egress (review F1): the gateway's
    # own route to IBKR's servers (the internal network has none). No "ports:" on purpose.
    networks: [internal, gw-egress]

  db:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_DB: ledger_bf_paper
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on:
      secrets-check: {condition: service_completed_successfully}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d ledger_bf_paper"]
      interval: 10s
      retries: 10

  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {BUILD_SHA: "${BUILD_SHA:-unknown}"}  # review F22
    image: asx-trader-bfast-trader:local
    restart: unless-stopped
    depends_on:
      secrets-check: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      gw-paper: {condition: service_started}
    environment:
      TZ: Australia/Sydney
      # password-free URL; the password is read from the db_password secret (S-03)
      # JOURNAL_DB (deploy/.env): ledger_bf_dryrun during the BF-D32 paper dry run only
      TRADER_BF_JOURNAL_URL: postgresql+psycopg://trader@db:5432/${JOURNAL_DB:-ledger_bf_paper}
    secrets: [db_password, totp_seed, eodhd_api_token, healthchecks_url, ibkr_flex_token,
              ibkr_flex_query_id,  # BF-D27: Flex download (read at each pull)
              vapid_private_key,   # BF-D40: Web Push to the phone app
              app_proxy_key,       # BF-D46: checks the dashboard's signature on app actions
              worker_job_key,      # BF-D48: signs server jobs for the root host worker
              app_passphrase]      # BF-D83: hash of the memorised passphrase ("none" = not set)
    volumes:
      - ../config:/app/config:ro
      # BF-D31: writable, the daily refresh appends the EODHD bulk files the decision reads
      - ${FORWARD_STORE:?path of bigwins_forward/data/eodhd}:/data/forward/eodhd
      - ${REF_DIR:?path holding etp_list.txt}:/data/ref:ro
      # BF-D23: the record's 68_forward_record (CORPORATE_ACTIONS.csv) and the Flex inbox
      - ${RECORD_DIR:?path of the record's 68_forward_record}:/data/forward/record:ro
      # BF-D27: writable, the scheduled Flex Web Service download writes the statements
      - ${FLEX_INBOX:?directory of IBKR Activity Flex XML files}:/data/flex/inbox
      # BF-D78: the private info archive (written by the host job, read here for the digest)
      - ${INFO_ARCHIVE_DIR:-/var/lib/bigwins/info}:/data/info:ro
      # BF-D94: the paper record's display copy, read-only: only for the plain numbers of the
      # "Paper record booked" Inbox message (never read by a decision)
      - ${RECORD_VIEW_DIR:-/var/lib/bigwins/recordview}:/data/recordview:ro
      # BF-D81 (S3 b): the previous-version twins' own volume (written by the worker's
      # throwaway dry runs, never the live output), read here for the app
      - twins:/data/twins:ro
      - traderout:/app/out
    # internal: gateway + db; egress: EODHD, IBKR Flex, Web Push, healthchecks (and Telegram
    # when on); control: the dashboard forwards the app's /act/... requests (BF-D39)
    networks:
      internal: {}
      egress: {}
      control:
        aliases: [trader-control]  # BF-D46: the control server listens on this address only
    # `trader-bf run` (scheduler + app actions/alerts + paper gateway) exists; the container stays
    # idle until the reality spike and the piece-2 dry runs pass, then the command changes.
    # (`trader-bf run` checks its secret files again first, BF-D33)
    # review F5: what runs is TRADER_CMD in deploy/.env (`bigwins start-trader <date>` sets
    # it after a confirmation); until then the container idles
    command: ["sh", "-c", "trader-bf check-secrets && trader-bf validate-config && exec ${TRADER_CMD:-sleep infinity}"]

  db-roles:
    # BF-D52: (re)creates the dashboard's SELECT-only database role, idempotently, at every
    # start (also for a journal that existed before), with the password in its own secret
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    environment:
      JOURNAL_DB: ${JOURNAL_DB:-ledger_bf_paper}
    secrets: [db_password, db_dashboard_password]
    volumes:
      - ./db_roles.sql:/sql/db_roles.sql:ro
    networks: [internal]
    command:
      - sh
      - -c
      - 'PGPASSWORD="$$(cat /run/secrets/db_password)" psql -h db -U trader -d "$$JOURNAL_DB" -v ON_ERROR_STOP=1 -v db="$$JOURNAL_DB" -v pw="$$(cat /run/secrets/db_dashboard_password)" -f /sql/db_roles.sql'

  dashboard:
    # BF-D37: the owner's phone app (`trader-bf dashboard`). Its own pages are read-only:
    # no broker, no Telegram, no push, the journal session is read-only in Postgres
    # (default_transaction_read_only), the trader's output and the price store are mounted
    # read-only, and its only secret is db_password. The app's actions (/act/..., BF-D39)
    # are forwarded unchanged to the trader's control server on the `control` network,
    # which re-checks everything. Published on the host's loopback only, never 0.0.0.0.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: asx-trader-bfast-trader:local
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      secrets-check: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      db-roles: {condition: service_completed_successfully}
    environment:
      TZ: Australia/Sydney
      # BF-D52: the SELECT-only role, its password from its own secret
      TRADER_BF_JOURNAL_URL: postgresql+psycopg://bigwins_dashboard@db:5432/${JOURNAL_DB:-ledger_bf_paper}
      TRADER_BF_DB_PASSWORD_SECRET: db_dashboard_password
    secrets: [db_dashboard_password, app_proxy_key]
    volumes:
      - ../config:/app/config:ro
      - ${FORWARD_STORE:?path of bigwins_forward/data/eodhd}:/data/forward/eodhd:ro
      - traderout:/app/out:ro
      # BF-D75: the research record's scorecard (research section); BF-D78: the private
      # announcements archive (share pages). Both read-only.
      - ${RECORD_DIR:?path of the record's 68_forward_record}:/data/forward/record:ro
      - ${INFO_ARCHIVE_DIR:-/var/lib/bigwins/info}:/data/info:ro
      # BF-D94: the paper record's display copy (scorecards, holdings, movers; kept by the
      # host worker) and the cloud's nightly report from the OneDrive relay (validated
      # files only). Read-only; the dashboard has no other view of the record tree.
      - ${RECORD_VIEW_DIR:-/var/lib/bigwins/recordview}:/data/recordview:ro
      - ${RELAY_VIEW_DIR:-/var/lib/bigwins/relay/inbox/validated}:/data/relay:ro
    read_only: true
    mem_limit: 512m  # review F11
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # internal: the database; dashboard: a plain bridge, needed only because Docker does
    # not publish ports from a container that is on internal networks alone
    networks: [internal, dashboard, control]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      retries: 3
    # inside the container it listens on all of the container's interfaces; the host side
    # is the 127.0.0.1 mapping above
    command: ["trader-bf", "dashboard", "--host", "0.0.0.0", "--port", "8080"]

networks:
  dashboard:              # the dashboard's loopback-published port (see above)
    ipam:                 # BF-D46: pinned, so the dashboard knows the address the host's
      config:             #   published port arrives from (the gateway) and believes the
        - subnet: 172.31.250.0/24   # Tailscale-User-Login header from it only
          gateway: 172.31.250.1
  internal:
    internal: true        # no internet: gateway<->trader<->db only
  egress: {}              # trader only: EODHD, IBKR Flex, Web Push, healthchecks, Telegram
  gw-egress: {}           # review F1: gw-paper only, its route to IBKR (nothing published)
  control:
    internal: true        # dashboard -> trader:8081 (the app's actions, BF-D39) only

volumes:
  pgdata: {}
  traderout: {}
  twins:
    name: bigwins_twins  # BF-D81: a fixed name, so the worker's dry runs find it (N6)

secrets:
  tws_password: {file: ./secrets/tws_password}
  db_password: {file: ./secrets/db_password}
  totp_seed: {file: ./secrets/totp_seed}
  eodhd_api_token: {file: ./secrets/eodhd_api_token}
  healthchecks_url: {file: ./secrets/healthchecks_url}
  ibkr_flex_token: {file: ./secrets/ibkr_flex_token}        # BF-D27: Flex Web Service token
  ibkr_flex_query_id: {file: ./secrets/ibkr_flex_query_id}  # the paper Activity Flex query
  vapid_private_key: {file: ./secrets/vapid_private_key}    # BF-D40: generated by `bigwins vapid`
  app_proxy_key: {file: ./secrets/app_proxy_key}            # BF-D46: made by `bigwins update`
  worker_job_key: {file: ./secrets/worker_job_key}          # BF-D48: made by `bigwins update`
  db_dashboard_password: {file: ./secrets/db_dashboard_password}  # BF-D52: made by `bigwins update`
  app_passphrase: {file: ./secrets/app_passphrase}          # BF-D83: "none" until `bigwins secret app_passphrase`
