# Strategy release notes (BF-D45), newest first. The app's Strategy screen shows them, and
# an incoming update shows its newest entry before you approve it. Plain English.
# Add an entry with every change to the strategy (config/bfast.yaml strategy settings,
# trader/lines/, trader/universe.py, trader/features.py, trader/panel.py, the LIC list).
versions:
  - version: "EMG2-18 C6 v1.2 (E5, proposed)"
    date: 2027-01-01
    fingerprint: "0ad8e21de254"
    what: >-
      PROPOSED, not in force until you approve it on or after 1 Jan 2027 (BF-D90). Two
      changes from the research of 25 Nov 2026 (research_bw "E5"). (1) Rule 14: when band C
      has fewer than 150 names the book still buys nothing and keeps the A200 fund, but every
      sale the rules require now goes ahead (stuck-price shares, rule C6 sales, and in fund
      state every share, with the money going into A200). Before, rule 14 stopped all
      trading, sales included. (2) The sweep: at each decision, anything above the A$10,000
      the strategy works with (from A$500) is put into A200 in a "sweep sleeve" instead of
      sitting in cash. The rules never sell, count or size on the sleeve; the scoreboard
      counts it.
    why: >-
      Over 2002-2026 today's rules sat in cash about half the time and trailed A200 by about
      1.7 points a year; this version led A200 by about 3.3 points a year before tax and
      about 1.4 points after 47% tax. Neither figure is statistically reliable (t about 0.75).
    tested: >-
      Full test suite; the decision equals a transcription of the research engine's E5 code
      on 1,200 random books and both switch states, normal months and thin bands; the
      strategy hash differs from v1.1 only by this change; nothing changes before 1 Jan 2027.
    takes_effect: "At the first decision on or after 1 Jan 2027 after you approve the update."
  - version: "EMG2-18 C6 v1.1"
    date: 2026-11-22
    fingerprint: "a50dfa0b4eb1"
    what: >-
      Fixes from the strategy-correctness review (BF-D72): dividends and splits counted once
      per ex-date; the L15 band index uses the research record's month-end steps (delisted
      names included); bid-peg needs 5 closes in its 10-session window (the registered rule)
      and the random twins' list leaves pegged names out; new codes from the bulk feed get
      columns; the ETP list is pinned; an out-of-cycle decision keeps the month-end L15 state.
      Trading-core fixes (BF-D69): sells never count against the L10 orders limit, the day
      limits fit a whole book, IBKR tiered commissions.
    why: >-
      The independent reviews of 22 Nov 2026: the live list and band index now match the
      paper record on 13 month-ends.
    tested: >-
      Full test suite; the live-parameter golden on 13 month-ends and the band-trend level /
      mean pinned on four dates with the record mounted; the record replay.
    takes_effect: "With the next decision after the update is approved."
  - version: "EMG2-18 C6 v1.0"
    date: 2026-11-22
    what: >-
      EMG2-18 book: 18 names at about A$550, buys from the EMG2 list T, sells under rule C6
      (only after 6 or more month-ends held AND outside the top 40% of band C), the L15
      trend shield into the A200 fund, the L11 staged loss rule. Random twins draw from the
      real book's buyable set (BF-D36).
    why: >-
      The registered paper line as amended up to 22 Nov 2026 (BF-D35 C6, BF-D36 twins).
    tested: >-
      Full test suite; record replay 30 Oct - 18 Nov 2026 and the T6 golden tests with the
      record mounted; the live EMG2 list of 30 Oct and 18 Nov equals the paper list.
    takes_effect: "Already running."
