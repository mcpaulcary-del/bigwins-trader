# B-fast configuration for the EMG2-20 book (FD v3.0 §7.9, §20 live_emg2_20, §21.1).
# PAPER ONLY in this build. Nothing secret lives here (tokens and seeds are Docker
# secrets); unknown keys are rejected.
version: 1
book: EMG2_18_PAPER
line: EMG2_18           # owner decision BF-D1: 18 names at about A$550 (EMG2-18)
mode: paper                     # the only accepted value in this build
broker:
  host: gw-paper                # docker-compose service name of IB Gateway (paper)
  port: 4004                    # gnzsnz/ib-gateway paper API relay; 4003 (live) is refused
  client_id: 21
  account_id: null              # the IBKR paper account (DU...), set at BF0; never a live id
  allow_live: false             # schema: must be false. Live enablement is a later owner step
  pricing: tiered               # review M1: the owner's IBKR plan (tiered | fixed); numbers in
                                #   broker.commission (defaults: 0.08%, min A$5, + GST; ASX fees unverified)
execution:
  order_type: LOC               # LOC | LMT  -- [unverified O-1] reality spike decides
  limit_band: 0.03              # L7 band (buy ref x 1.03, sell ref x 0.97)
  submit_at: "15:45"            # LOC submit; LMT fallback sends at 15:30 [unverified cut-off]
  fallback_send_at: "15:30"
  fallback_cancel_at: "15:58"
  approval_mode: per_order      # L8 to the April 2027 decision; also used on paper dry runs
  approval_deadline: "15:20"
  buy_funds_wait_sessions: 4    # L7 / O-2
  latest_send: "15:55"          # review H3: nothing is sent after this (early close: close - 10 min)
  no_order_days: []             # review H4: ad-hoc market closures (YYYY-MM-DD); orders go the next
                                #   full session. 24 and 31 Dec (early closes) are never order days
live_emg2_20:
  capital_cap_aud: 10000
  slots: 18                     # name count (BF-D1, EMG2-18); 10,000/18 = A$555 parcels
  slot_unit_aud: 550            # L3 of AMENDMENT_live_EMG2_18: n = min(18, floor(value/550))
  min_parcel_aud: 500
  cash_reserve_aud: 50
  skip_lottery: true
  sell_rule: C6                 # BF-D35 (AMENDMENT_live_EMG2_18_C6.md, owner after report 100): sell only
                                #   after >= 6 month-ends held AND outside the top 40% of band C (BID_PEG,
                                #   payouts, the L15 switch unchanged); L4 = the old rule (paper comparison)
risk:
  order_value_max_aud: 800
  orders_per_day: {start: 24, normal: 20, hard: 80}   # review H6: buys only (sells never count);
                                                     #   hard (BW-RSK-09) counts every order
  buys_per_day_aud: {start: 10500, normal: 10500}    # review H6: a whole book of 18 buys fits
                                                     #   (>= capital cap x 1.03, checked)
  price_band: 0.03
  gap_hold: 0.15
  absurd_move: 0.60
  participation_max: 0.05
  quote_stale_minutes: 40
  value_review_aud: 7000
  value_halt_buys_aud: 6000
  value_line_halt_aud: 5000
  drawdown: {review: 0.30, halt: 0.50}
  day_move: {review: -0.07, halt: -0.12}
  real_money_floor: 0.60
data:
  forward_store: /data/forward/eodhd        # $B/bigwins_forward/data/eodhd; writable on the server:
                                            # the daily refresh below appends the bulk files (BF-D31)
  sim_book: EMG2_18_SIM                     # simulated twin (L13)
  sim_half_spread: 0.005                    # L9 start spread, a side
  random_twins: 100                         # EMG2_18_RND_s001...s100 (L13; L11 test (b))
  random_prefix: EMG2_18_RND
  random_seed_base: 8550000                 # seed = base + i (AMENDMENT_live_EMG2_20)
  etp_list: /data/ref/etp_list.txt
  etp_list_sha256: 58f006941ec74d5ee6b11dbde8f9abb8a8fb0f1f736736513d8ce67fbcff08cc  # BF-D72: pinned (fail closed)
  lic_list: config/lic_list.csv             # verbatim copy of the record's LIC_list_frozen_v2.csv
                                            # (BF-D20; ledger seq 62; 69 codes); the class rule
                                            # excludes LICs/funds by this list only (no name words);
                                            # $TRADER_BF_LIC_LIST overrides the path (e.g. the record file)
  lic_list_sha256: af441f284b2dedfd7ffb13833907a6e635c9bab834a99ce949014b705fe36582
                                            # BF-D21: required; no fallback list. Missing or
                                            # changed file => no decision, no order, owner paged
  history_sessions: 760
  corporate_actions_csv: /data/forward/record/CORPORATE_ACTIONS.csv
                                            # BF-D23: the record's 68_forward_record/CORPORATE_ACTIONS.csv
                                            # (read-only mount; $TRADER_BF_CA_CSV overrides); corrects
                                            # the vendor (capital return / special / in specie / demerger)
  flex_inbox: /data/flex/inbox              # BF-D23: IBKR Activity Flex XML of the paper book; its
                                            # dividends and corporate actions are booked from it
  flex_pull:                                # BF-D27: Flex Web Service download into flex_inbox at
    raw_dir: /app/out/flex_raw              # 13:05..16:25 (before the 16:30 recon), paged if late;
    lookback_days: 7                        # token + query id: Docker secrets ibkr_flex_token /
    max_days: 30                            # ibkr_flex_query_id only (never here)
    attempts: 2
    backoff_seconds: 5
  store_refresh:                            # BF-D31: EODHD bulk closes + dividends + splits of the
    raw_dir: /app/out/eodhd_raw             # session into forward_store at 17:35..22:05 (after the
    calls_per_day: 100000                   # close, before the 22:20 decision); counted per GMT day
    bulk_call_cost: 100                     # in the journal before each request (EODHD: 100 a bulk call)
    min_rows: 1000                          # closes dated D (the record has about 1,400-1,900)
    min_share: 0.9                          # and >= 90% of the previous bulk day's; else retried
    attempts: 2                             # key: Docker secret eodhd_api_token only (never here);
    backoff_seconds: 5                      # stale store => no decision, owner paged
band_trend:                     # L15 (AMENDMENT_live_EMG2_18_BT.md; owner decision after report 96; BF-D28)
  enabled: true                 # month-end: band 301-600 equal-weight index below its 10-month average
  fund: A200                    #   -> "state: FUND": sell EMG2 shares, hold the ASX 200 fund (A200);
  months: 10                    #   back at or above -> "state: EMG2": sell A200, buy the EMG2-18 picks
  top_up_fraction: 0.10         # a later FUND decision tops the fund up only if cash >= 10% of the account
  fund_order_max_aud: 10000     # one fund order (paged above the A$800 share-order limit); IBKR's
                                # precautionary order value must be above it (as for sells, BF-D3)
  fund_half_spread: 0.0005      # simulated twin / random twins: the fund's spread a side (report 96)
tax:                            # BF-D29: `trader-bf tax-report --fy 2026-27` (general information, not tax advice)
  parcel_method: FIFO           # FIFO (default) | min_tax = specific identification: only after the accountant confirms (O-8)
  discount_rule: 12_months      # BF-D44 (owner): 50% CGT discount when sold later than 12 months after buying
  discount_days: 367            #   (ATO test); "days" = from discount_days held (BF-D29's safety margin)
  prior_losses_aud: 0           # BF-D51: net capital losses carried in from before this book
  marginal_rate: null           # BF-D44: your marginal rate incl. Medicare (e.g. 0.345) for the app's tax
                                #   estimate; set on the server only, never in the repository
  fund_codes: [A200]            # trust distributions (band_trend.fund is added anyway); AMIT figures entered by hand:
  amit_csv: null                #   fy,code,cost_base_increase,cost_base_decrease,note (from each annual tax statement)
notify:                        # BF-D40: where messages go and where your commands come from
  channel: app                  # app (the phone app: inbox + alerts, actions in the app) |
                                #   telegram (the old bot) | both
telegram:                       # only used when notify.channel is telegram or both
  allowed_chat_ids: []          # the owner's chat id (then also the telegram_bot_token secret)
app:                            # BF-D39: actions in the phone app (approve, pause, kill...)
  allowed_logins: []            # the Tailscale log-in(s) allowed to ACT; empty = actions off.
                                #   Set on the server only (bigwins menu "Allow my phone to
                                #   act"); keep it empty in the repository
  control_port: 8081            # the trader's action server on its private network (not published)
  control_url: http://trader-control:8081  # where the dashboard forwards /act/... requests
  control_bind_host: trader-control  # BF-D46: the trader listens only on its control-network address
  public_host: ""               # BF-D46: your app's host (bigwins.<tailnet>.ts.net); set on the server
                                #   by `bigwins login`; with it, an action's Origin must be this host
strategy:                       # BF-D45: strategy updates from the app (Server > Strategy)
  update_mode: immediate        # immediate (paper, early stage): applied once the ASX is closed and no
                                #   order is working, then an out-of-cycle decision for your approval |
                                #   next_decision: from the next month-end decision (24 h block before it)
costs:                          # BF-D72: fixed costs (server, price data) in the L14 cost statement
  fixed_aud_per_year: 600       #   and against "the same money in A200" (owner: H2/H4 decisions open)
heartbeat:                      # BF-D41: dead-man ping to the healthchecks_url secret ("none" = off)
  every_seconds: 300
dashboard:                      # BF-D37: read-only phone page (`trader-bf dashboard`), Tailscale only
  allowed_logins: []            # Tailscale log-ins allowed (tailscale serve's Tailscale-User-Login
                                #   header); empty = anyone on your own tailnet
  index_code: A200              # the comparison line (the ASX 200 fund, from the price store)
  trusted_proxies: [172.31.250.1]  # BF-D46: Tailscale-User-Login is believed only from the gateway of
                                #   the `dashboard` network (deploy/docker-compose.yml pins its subnet)
journal:
  url_env: TRADER_BF_JOURNAL_URL  # name of the env var holding a password-free URL; the
                                  # password comes from the db_password Docker secret
