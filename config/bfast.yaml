# B-fast configuration for the EMG2-20 book (FD v3.0 §7.9, §20 live_emg2_20, §21.1).
# PAPER ONLY in this build. Nothing secret lives here (tokens and seeds are Docker
# secrets); unknown keys are rejected.
version: 1
book: EMG2_18_PAPER
line: EMG2_18           # owner decision BF-D1: 18 names at about A$550 (EMG2-18)
mode: paper                     # the only accepted value in this build
broker:
  host: gw-paper                # docker-compose service name of IB Gateway (paper)
  port: 4004                    # gnzsnz/ib-gateway paper API relay; 4003 (live) is refused
  client_id: 21
  account_id: null              # the IBKR paper account (DU...), set at BF0; never a live id
  allow_live: false             # schema: must be false. Live enablement is a later owner step
execution:
  order_type: LOC               # LOC | LMT  -- [unverified O-1] reality spike decides
  limit_band: 0.03              # L7 band (buy ref x 1.03, sell ref x 0.97)
  submit_at: "15:45"            # LOC submit; LMT fallback sends at 15:30 [unverified cut-off]
  fallback_send_at: "15:30"
  fallback_cancel_at: "15:58"
  approval_mode: per_order      # L8 to the April 2027 decision; also used on paper dry runs
  approval_deadline: "15:20"
  buy_funds_wait_sessions: 4    # L7 / O-2
live_emg2_20:
  capital_cap_aud: 10000
  slots: 18                     # name count (BF-D1, EMG2-18); 10,000/18 = A$555 parcels
  slot_unit_aud: 550            # L3 of AMENDMENT_live_EMG2_18: n = min(18, floor(value/550))
  min_parcel_aud: 500
  cash_reserve_aud: 50
  skip_lottery: true
risk:
  order_value_max_aud: 800
  orders_per_day: {start: 24, normal: 16, hard: 80}
  buys_per_day_aud: {start: 10500, normal: 4500}
  price_band: 0.03
  gap_hold: 0.15
  absurd_move: 0.60
  participation_max: 0.05
  quote_stale_minutes: 40
  value_review_aud: 7000
  value_halt_buys_aud: 6000
  value_line_halt_aud: 5000
  drawdown: {review: 0.30, halt: 0.50}
  day_move: {review: -0.07, halt: -0.12}
  real_money_floor: 0.60
data:
  forward_store: /data/forward/eodhd        # read-only mount of $B/bigwins_forward/data/eodhd
  sim_book: EMG2_18_SIM                     # simulated twin (L13)
  sim_half_spread: 0.005                    # L9 start spread, a side
  random_twins: 100                         # EMG2_18_RND_s001...s100 (L13; L11 test (b))
  random_prefix: EMG2_18_RND
  random_seed_base: 8550000                 # seed = base + i (AMENDMENT_live_EMG2_20)
  etp_list: /data/ref/etp_list.txt
  lic_list: config/lic_list.csv             # verbatim copy of the record's LIC_list_frozen_v2.csv
                                            # (BF-D20; ledger seq 62; 69 codes); the class rule
                                            # excludes LICs/funds by this list only (no name words);
                                            # $TRADER_BF_LIC_LIST overrides the path (e.g. the record file)
  lic_list_sha256: af441f284b2dedfd7ffb13833907a6e635c9bab834a99ce949014b705fe36582
                                            # BF-D21: required; no fallback list. Missing or
                                            # changed file => no decision, no order, owner paged
  history_sessions: 760
  corporate_actions_csv: /data/forward/record/CORPORATE_ACTIONS.csv
                                            # BF-D23: the record's 68_forward_record/CORPORATE_ACTIONS.csv
                                            # (read-only mount; $TRADER_BF_CA_CSV overrides); corrects
                                            # the vendor (capital return / special / in specie / demerger)
  flex_inbox: /data/flex/inbox              # BF-D23: IBKR Activity Flex XML of the paper book; its
                                            # dividends and corporate actions are booked from it
  flex_pull:                                # BF-D27: Flex Web Service download into flex_inbox at
    raw_dir: /app/out/flex_raw              # 13:05..16:25 (before the 16:30 recon), paged if late;
    lookback_days: 7                        # token + query id: Docker secrets ibkr_flex_token /
    max_days: 30                            # ibkr_flex_query_id only (never here)
    attempts: 2
    backoff_seconds: 5
band_trend:                     # L15 (AMENDMENT_live_EMG2_18_BT.md; owner decision after report 96; BF-D28)
  enabled: true                 # month-end: band 301-600 equal-weight index below its 10-month average
  fund: A200                    #   -> "state: FUND": sell EMG2 shares, hold the ASX 200 fund (A200);
  months: 10                    #   back at or above -> "state: EMG2": sell A200, buy the EMG2-18 picks
  top_up_fraction: 0.10         # a later FUND decision tops the fund up only if cash >= 10% of the account
  fund_order_max_aud: 10000     # one fund order (paged above the A$800 share-order limit); IBKR's
                                # precautionary order value must be above it (as for sells, BF-D3)
  fund_half_spread: 0.0005      # simulated twin / random twins: the fund's spread a side (report 96)
telegram:
  allowed_chat_ids: []          # the owner's chat id, set at BF0
journal:
  url_env: TRADER_BF_JOURNAL_URL  # name of the env var holding a password-free URL; the
                                  # password comes from the db_password Docker secret
