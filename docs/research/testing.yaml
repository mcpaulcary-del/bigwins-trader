# docs/research/testing.yaml (BF-D89)
# Order = the registered order of ledger seq 96. NEVER sort by result. `id` matches ops_view.KEPT_LINES.
version: 1
intro: "Everything here runs on pretend money. Lines are listed in the order they were registered, never by result. Over a few months any difference is mostly luck at this stage."
first_decision: 2026-11-30
groups:
  - name: "The main line"
    note: "The only line eligible for real money in March 2027."
    lines:
      - {id: BT_C6, name: "Big Wins (main line)", what: "18 shares from ASX ranks 301-600 with the highest score, with the trend shield and the patient sell rule. Frozen until 1 January 2027.", reading: "Checked each December. Even 24 months catches only large failures.", label: "main"}
  - name: "Comparisons"
    note: "Yardsticks. They exist so the main line has something fair to be measured against."
    lines:
      - {id: REF, name: "Reference book", what: "The main rules without the trend shield. The comparison book for the aggressive lines.", reading: "December 2028 review"}
      - {id: EMG2, name: "EMG2 (the first challenger)", what: "The same idea in a book ten times larger, to measure costs at a larger size.", reading: "December 2028 review"}
      - {id: H82, name: "Large-Cap Core", what: "A large-company rule kept as a control.", reading: "December 2028 review"}
      - {id: MOM, name: "Plain momentum", what: "A textbook momentum rule kept as a control.", reading: "December 2028 review"}
      - {id: BLIND3, name: "Steady Momentum", what: "A candidate built blind, without seeing the main line's results.", reading: "December 2028 review"}
  - name: "The main line with one change"
    note: "Each differs from the main line in exactly one way, so a difference can be traced to that change."
    lines:
      - {id: SWEEP, name: "SWEEP", what: "Cash above the book's cap buys the A200 fund instead of sitting idle.", reading: "Monthly arithmetic; no pass mark"}
      - {id: WIDE, name: "WIDE", what: "A narrower lottery filter: only shares under 20c or listed under about two years are skipped.", reading: "Pass mark read at 24 months (late 2028)"}
      - {id: FIP, name: "FIP", what: "Buys the steadiest risers first.", reading: "Pass mark read at 36 months (late 2029). Low expectation."}
  - name: "Aggressive lines"
    note: "Built to chase bigger years. In back-tests each also lost two-thirds to three-quarters of its value at some point. No proposal before December 2028."
    lines:
      - {id: MOON_TOP5, name: "MOON TOP5", what: "The 5 best-scored shares instead of 18.", reading: "December 2028 review"}
      - {id: MOON_NOLOT5, name: "MOON NOLOT5", what: "5 shares, with no lottery filter.", reading: "December 2028 review"}
      - {id: MOON_LEG2, name: "MOON LEG2", what: "Up to 10 shares that have already doubled and are still near their high; sold once it falls three-tenths from its high, or after 12 months.", reading: "December 2028 review"}
info_lines:
  note: "Not strategies. They hold no money, even on paper; they only measure whether a piece of information tells us anything."
  lines:
    - {id: EST-C, name: "Analyst estimate changes (ranks 301-600)", what: "Do shares whose forecasts are being raised do better the next month?", reading: "First reading at 24 months (late 2028)"}
    - {id: DIL-C, name: "Dilution flag (ranks 301-600)", what: "Do companies that grew their share count by more than a fifth in 12 months do worse over the next 6 and 12 months?", reading: "First reading at 24 months (late 2028)"}
retiring:
  day: 2026-12-31
  note: "Chosen on structure, before any result: each duplicates another line, was already rejected, or cannot pass. History is kept."
  lines: [H6, COMBO, SIM_BT, PAIR, EARLY, ACC, M3, E3, CXL]
  also: "The 100 random twins of the Reference book (the book itself is kept)."
rules:
  - "No line is proposed for real money before the December 2028 review."
  - "A proposal then needs all of: ahead of at least 90 of its 100 random twins; not behind the Reference book after costs over 24 months; a worst fall no more than 10 points deeper; a blind rebuild that arrives at the same rule; your decision."
  - "With eight side lines, about one would clear a 90-in-100 bar by luck alone. The review corrects for that."
  - "No new paper line of any kind before December 2028 unless one is retired."
archives:
  note: "Data we cannot buy as history, so we collect it going forward. Private, never shared, and it feeds no strategy."
  items:
    - {id: asx_notices, name: "ASX notices", what: "Each day's announcement list, plus director share dealings and capital-raising notices.", since: "November 2026; on the server after the record moves there", reading: "Nothing usable before about 2029", health_key: info}
    - {id: asic_short, name: "Short selling", what: "The regulator's daily list of how much of each company is sold short.", since: "Public history back to 2010; collected daily", reading: "Tested in November 2026: no wreck warning in ranks 301-600, where almost nothing is shorted"}
    - {id: estimates, name: "Analyst estimates", what: "A daily snapshot of forecasts for the top 300, and since November 2026 for ranks 301-600.", since: "November 2026 for ranks 301-600", reading: "With EST-C, at 24 months (late 2028)"}
    - {id: shares_on_issue, name: "Shares on issue", what: "How many shares each company has issued, to spot dilution.", since: "November 2026 for ranks 301-600", reading: "With DIL-C, at 24 months (late 2028)"}
in_progress: []   # design slots; each becomes a library card (status: testing) and is removed from here when it reports
