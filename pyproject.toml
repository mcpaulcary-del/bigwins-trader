[project]
name = "asx-trader"
version = "0.0.1"
description = "Automated long-only monthly ASX ETF trading system (spec v2.10). M0 foundations and M1 data pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins (INF-04); uv.lock pins the full transitive set with hashes.
dependencies = [
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.9",
    "tzdata==2025.2",
    "pandas==2.3.3",
    "numpy==2.3.4",
    "exchange_calendars==4.11.2",  # OPS-05: XASX session-date cross-check only
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.11",
    "mypy==1.17.1",
    "types-PyYAML==6.0.12.20250822",
    "pandas-stubs==2.3.2.250926",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "DTZ", "RUF", "SIM", "PT", "C4", "PL"]
ignore = [
    "PLR0913",  # many-argument functions are fine for explicit interfaces
    "PLR2004",  # magic values in comparisons (tests/constants)
    "S101",     # assert is used in tests
    "PLC0415",  # deliberate lazy imports (alembic, avoid cycles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ001", "N802", "PT018", "C408"]  # test names carry requirement IDs (§20)
"migrations/**" = ["E501", "N999", "S608"]  # role names validated by regex

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["trader", "tests", "scripts", "migrations"]
explicit_package_bases = true

# Decision core (§3/§20): strict, no relaxations ever.
[[tool.mypy.overrides]]
module = ["trader.rules.*", "trader.strategy", "trader.orders", "trader.risk", "trader.config", "trader.money", "trader.timeutil", "trader.calendar", "trader.data.*"]
strict = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real external system (IBKR paper, server); never run in CI",
    "postgres: needs a reachable PostgreSQL 16 (TRADER_TEST_PG_URL); skipped if unset",
]
filterwarnings = ["error"]

[tool.uv]
# BP-10 / ops.dependency_min_age_days: no package version younger than 14 days.
# Move this date forward deliberately when re-locking.
exclude-newer = "2026-10-29T00:00:00Z"
